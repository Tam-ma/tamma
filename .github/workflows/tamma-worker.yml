name: Tamma Worker

on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: 'GitHub App installation ID'
        required: true
        type: string
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string
      callback_url:
        description: 'Orchestrator callback URL'
        required: true
        type: string
      workflow_id:
        description: 'Tamma workflow ID for status tracking'
        required: false
        type: string

permissions:
  contents: read

jobs:
  process-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tamma-issue-${{ inputs.issue_number }}
      cancel-in-progress: false

    steps:
      # This template can also be installed in a tenant repository.
      - name: Checkout runner source
        uses: actions/checkout@v4
        with:
          repository: Tam-ma/tamma
          ref: ${{ github.repository == 'Tam-ma/tamma' && github.sha || '72a97479a86b5cdef1e05af9da8d915f66446a29' }}
          path: runner
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build runner
        working-directory: runner
        run: |
          corepack enable
          pnpm --filter tamma --filter @tamma/worker-runner... install --frozen-lockfile
          pnpm --filter @tamma/worker-runner... run build
          echo "$PWD/packages/worker-runner/node_modules/.bin" >> "$GITHUB_PATH"

      # With no owner/repositories overrides the action finds the installation
      # for this repository and limits the minted token to this repository.
      - name: Get repository installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TAMMA_APP_ID }}
          private-key: ${{ secrets.TAMMA_APP_PRIVATE_KEY }}

      - name: Checkout issue repository
        uses: actions/checkout@v4
        with:
          path: project
          # The implementation agent pushes its branch with this repository-scoped token.
          token: ${{ steps.app-token.outputs.token }}

      - name: Process issue
        working-directory: project
        env:
          NODE_ENV: production
          OPENSEARCH_ENABLED: 'false'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAMMA_TOKEN_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          TAMMA_GITHUB_OWNER: ${{ github.repository_owner }}
          TAMMA_GITHUB_REPO: ${{ github.event.repository.name }}
          TAMMA_INSTALLATION_ID: ${{ inputs.installation_id }}
          TAMMA_ISSUE_NUMBER: ${{ inputs.issue_number }}
          TAMMA_WORKFLOW_ID: ${{ inputs.workflow_id }}
          TAMMA_API_KEY: ${{ secrets.TAMMA_API_KEY }}
          TAMMA_API_URL: ${{ vars.TAMMA_API_URL || 'https://app.tamma.dev' }}
        run: node ../runner/packages/worker-runner/dist/index.js process-issue
