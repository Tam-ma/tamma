name: CI

on:
  push:
    branches: [main, feat/wave-a, feat/engine-mvp, feat/deployment]
  pull_request:
    branches: [main, feat/wave-a]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck wiki-site
        run: pnpm --filter @tamma/wiki-site run typecheck

      - name: Typecheck dashboard
        run: pnpm --filter @tamma/dashboard run typecheck

      - name: Typecheck dashboard-user
        run: pnpm --filter @tamma/dashboard-user run typecheck

      - name: Run tests
        run: pnpm vitest run

      - name: Run dashboard tests (jsdom + jest-dom; own vitest config)
        run: pnpm --filter @tamma/dashboard test

      - name: Run dashboard-user tests (jsdom + jest-dom; own vitest config)
        run: pnpm --filter @tamma/dashboard-user test

      - name: Verify CLI bundle builds
        run: pnpm --filter @tamma/cli run build:bundle

      - name: Shellcheck shell scripts
        # install.sh plus the Tamma agent runner installer and the scripts it
        # copies into a customer repo (Epic 40-1). All clean today — this step is
        # a ratchet so a future edit to any of them cannot regress silently.
        run: |
          shellcheck install.sh
          shellcheck apps/tamma-elsa/runner/github-actions/install-runner.sh
          shellcheck apps/tamma-elsa/runner/github-actions/scripts/*.sh
          shellcheck .github/scripts/dotnet-test-run.sh

      - name: Lint GitHub Actions workflows
        # actionlint also shellchecks the `run:` blocks embedded in the workflow
        # files, which plain shellcheck cannot see.
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  integration-tests:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Postgres image (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 60
          command: docker pull pgvector/pgvector:pg16

      - name: Start Postgres (pgvector)
        run: |
          docker run -d --name postgres-test \
            -e POSTGRES_USER=tamma_test \
            -e POSTGRES_PASSWORD=tamma_test \
            -e POSTGRES_DB=tamma_test \
            -p 5433:5432 \
            --tmpfs /var/lib/postgresql/data \
            --health-cmd "pg_isready -U tamma_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 5 \
            pgvector/pgvector:pg16

      - name: Start ChromaDB
        run: |
          docker run -d --name chromadb-test \
            -e ANONYMIZED_TELEMETRY=false \
            -e IS_PERSISTENT=false \
            -p 8000:8000 \
            chromadb/chroma:1.5.8

      - name: Wait for Postgres healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' postgres-test 2>/dev/null || echo 'starting')
            echo "Check $i/30: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Postgres failed to become healthy" && docker logs postgres-test && exit 1

      - name: Wait for ChromaDB healthy
        run: |
          # ChromaDB 1.x retired the /api/v1 prefix; healthcheck path is now /api/v2.
          # Extended to 60s (was 30s) because the Rust-backed v1.5.x server has a
          # slower cold-boot than the Python v0.x server.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v2/heartbeat > /dev/null 2>&1; then
              echo "ChromaDB is healthy"
              exit 0
            fi
            echo "Check $i/30: waiting..."
            sleep 2
          done
          echo "ChromaDB failed to become healthy" && docker logs chromadb-test && exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (builds project references)
        run: pnpm typecheck

      - name: Run integration tests
        env:
          INTEGRATION_TEST_PG: 'true'
          PG_TEST_HOST: localhost
          PG_TEST_PORT: '5433'
          PG_TEST_USER: tamma_test
          PG_TEST_PASSWORD: tamma_test
          PG_TEST_DB: tamma_test
          PGVECTOR_TEST_CONNECTION_STRING: 'postgresql://tamma_test:tamma_test@localhost:5433/tamma_test'
          CHROMADB_TEST_URL: 'http://localhost:8000'
        run: npx vitest run --config vitest.integration.config.ts

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (builds project references)
        run: pnpm typecheck

      - name: Run E2E tests
        run: npx vitest run --config vitest.e2e.config.ts --passWithNoTests

  # The C# suite runs as parallel slices so no job runs long. It used to be ONE
  # job: ~2.5 min of setup plus ~16.5 min of Tamma.Api.Tests plus ~1 min of every
  # other project. Runs that crossed its 25-min limit were reported as
  # "cancelled", which was misread for months as something cancelling runs from
  # outside (see .dev/findings/external-ci-run-cancellations-pr-511.md).
  #
  # Now: Tamma.Api.Tests is split by test CLASS into API_SHARDS balanced shards
  # (.github/scripts/dotnet-test-shard.py, weights in dotnet-test-weights.json),
  # and every other project runs in one more slice. Target: each slice's tests
  # take under ~2.5 min, so a whole job finishes in about 5. When a slice grows
  # past that, raise API_SHARDS (and the matrix list) or regenerate the weights.
  dotnet-tests-slice:
    name: .NET Tests (${{ matrix.slice }})
    runs-on: ubuntu-latest
    # Hang guard, not the target: a healthy slice finishes in ~5 min.
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slice: [other, api-1, api-2, api-3, api-4, api-5, api-6, api-7, api-8]
    env:
      API_SHARDS: 8
    defaults:
      run:
        working-directory: apps/tamma-elsa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Tenant-move / backup tests shell out to pg_dump/pg_restore, and pg_dump
      # refuses servers newer than itself — the runner's stock client is older
      # than the postgres:17 test container, so install client 17 from pgdg
      # (official install steps from postgresql.org/download).
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      # API slices build only what Tamma.Api.Tests needs; the "other" slice
      # builds the whole solution (it runs every other test project).
      - name: Restore
        run: |
          if [ "${{ matrix.slice }}" = "other" ]; then
            dotnet restore Tamma.sln
          else
            dotnet restore tests/Tamma.Api.Tests/Tamma.Api.Tests.csproj
          fi

      - name: Build
        run: |
          if [ "${{ matrix.slice }}" = "other" ]; then
            dotnet build Tamma.sln --no-restore -c Release
          else
            dotnet build tests/Tamma.Api.Tests/Tamma.Api.Tests.csproj --no-restore -c Release
          fi

      - name: Test
        run: |
          slice="${{ matrix.slice }}"
          if [ "$slice" = "other" ]; then
            ../../.github/scripts/dotnet-test-run.sh other
          else
            ../../.github/scripts/dotnet-test-run.sh api "${slice#api-}" "$API_SHARDS"
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ matrix.slice }}
          path: |
            apps/tamma-elsa/tests/**/TestResults/**
          if-no-files-found: ignore

  # One stable status for the whole C# suite, under the job's old name.
  dotnet-tests:
    name: .NET Tests
    needs: dotnet-tests-slice
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All slices passed
        run: |
          result="${{ needs.dotnet-tests-slice.result }}"
          echo "slices: $result"
          [ "$result" = "success" ]
